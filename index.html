<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IA Pinball - Senior Dev Version</title>
<style>
    html,body{height:100%;margin:0;background:#111;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#fff;overflow:hidden;}
    canvas{background:#000;border:4px solid #0ff;box-shadow:0 0 20px #0ff;border-radius:8px;display:block;}
    #ui{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:1.2rem;letter-spacing:1px;text-shadow:0 0 5px #0ff;}
</style>
</head>
<body>
<canvas id="pinballCanvas" width="400" height="600"></canvas>
<div id="ui">Puntuación: 0</div>

<script>
(() => {
    const canvas = document.getElementById('pinballCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // === Game objects ===
    const ball = {
        x: width / 2,
        y: height - 150,
        radius: 8,
        vx: 0,
        vy: 0,
        color: '#ff0',
        glow: 8
    };

    const gravity = 0.15;
    const friction = 0.995;
    const restitution = 0.85; // wall bounce

    // Paddles (flippers)
    const flipper = {
        width: 100,
        height: 12,
        gap: 30, // distance from center to inner edge
        baseY: height - 40,
        left: {
            pivotX: width/2 - this.gap, // will set after
            pivotY: height - 40,
            angle: 0, // radians, 0 = horizontal pointing right
            targetAngle: 0,
            angularSpeed: 0,
            color: '#ff0'
        },
        right: {
            pivotX: width/2 + this.gap,
            pivotY: height - 40,
            angle: 0, // 0 = horizontal pointing left (we'll treat negative angle as up)
            targetAngle: 0,
            angularSpeed: 0,
            color: '#ff0'
        }
    };
    // fix left pivotX after gap defined
    flipper.left.pivotX = width/2 - flipper.gap;
    flipper.right.pivotX = width/2 + flipper.gap;

    const maxAngle = 45 * Math.PI / 180; // 45 degrees
    const accelAngle = 0.05; // radians per frame for smooth movement

    // Input
    const keys = { ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', e => {
        if (e.key in keys) keys[e.key] = true;
    });
    window.addEventListener('keyup', e => {
        if (e.key in keys) keys[e.key] = false;
    });

    // Score
    let score = 0;
    const scoreEl = document.getElementById('ui');

    // === Helper functions ===
    function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
    }

    // Rotate point around origin
    function rotatePoint(px, py, cx, cy, angle) {
        const s = Math.sin(angle);
        const c = Math.cos(angle);
        const nx = (px - cx) * c - (py - cy) * s + cx;
        const ny = (px - cx) * s + (py - cy) * cy + cy; // Wait fix: should be +cy
        // Actually correct formula:
        // nx = cos * (px - cx) - sin * (py - cy) + cx
        // ny = sin * (px - cx) + cos * (py - cy) + cy
        return {
            x: Math.cos(angle) * (px - cx) - Math.sin(angle) * (py - cy) + cx,
            y: Math.sin(angle) * (px - cx) + Math.cos(angle) * (py - cy) + cy
        };
    }

    // Get paddle segment (world coordinates) given base pivot and angle
    function getFlipperSegment(side) {
        const f = flipper[side];
        const length = flipper.width;
        const angle = f.angle;
        // For left paddle: angle positive rotates up from pointing right
        // For right paddle: angle positive rotates up from pointing left? We'll treat angle as upward from horizontal.
        // We'll compute tip relative to pivot: pointing initially to the right for left, to the left for right.
        const dx = length * Math.cos(angle);
        const dy = length * Math.sin(angle);
        let tipX, tipY;
        if (side === 'left') {
            tipX = f.pivotX + dx;
            tipY = f.pivotY - dy; // negative because angle up reduces y
        } else {
            // right paddle points left initially
            tipX = f.pivotX - dx;
            tipY = f.pivotY - dy;
        }
        return {
            pivot: {x: f.pivotX, y: f.pivotY},
            tip: {x: tipX, y: tipY},
            nx: Math.sin(angle), // normal? We'll compute later
            ny: -Math.cos(angle)
        };
    }

    // Distance from point to segment, and closest point
    function pointToSegmentDist(px, py, ax, ay, bx, by) {
        const dx = bx - ax;
        const dy = by - ay;
        const lenSq = dx*dx + dy*dy;
        if (lenSq === 0) return {dist: Math.hypot(px-ax, py-ay), closest: {x:ax, y:ay}};
        const t = ((px-ax)*dx + (py-ay)*dy) / lenSq;
        const clampT = Math.max(0, Math.min(1, t));
        const projX = ax + clampT * dx;
        const projY = ay + clampT * dy;
        return {
            dist: Math.hypot(px-projX, py-projY),
            closest: {x:projX, y:projY}
        };
    }

    // Reflect velocity vector off a surface with normal (nx, ny) (normalized)
    function reflect(vx, vy, nx, ny) {
        const dot = vx*nx + vy*ny;
        return {
            x: vx - 2 * dot * nx,
            y: vy - 2 * dot * ny
        };
    }

    // === Game loop functions ===
    function update() {
        // --- Paddle input ---
        const left = flipper.left;
        const right = flipper.right;
        // left paddle
        if (keys.ArrowLeft) {
            left.targetAngle = maxAngle;
        } else {
            left.targetAngle = 0;
        }
        // right paddle
        if (keys.ArrowRight) {
            right.targetAngle = maxAngle;
        } else {
            right.targetAngle = 0;
        }
        // smooth angular movement
        const maxAngSpeed = 0.2;
        function updatePaddle(p) {
            const diff = p.targetAngle - p.angle;
            // simple spring-damper
            p.angularSpeed += diff * 0.1 - p.angularSpeed * 0.3;
            p.angularSpeed = clamp(p.angularSpeed, -maxAngSpeed, maxAngSpeed);
            p.angle += p.angularSpeed;
        }
        updatePaddle(left);
        updatePaddle(right);

        // --- Ball physics ---
        // gravity
        ball.vy += gravity;
        // friction
        ball.vx *= friction;
        ball.vy *= friction;
        // integrate
        ball.x += ball.vx;
        ball.y += ball.vy;

        // --- Wall collisions ---
        // left wall
        if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx = Math.abs(ball.vx) * restitution;
        }
        // right wall
        if (ball.x + ball.radius > width) {
            ball.x = width - ball.radius;
            ball.vx = -Math.abs(ball.vx) * restitution;
        }
        // top wall (flat for simplicity)
        if (ball.y - ball.radius < 0) {
            ball.y = ball.radius;
            ball.vy = Math.abs(ball.vy) * restitution;
        }
        // bottom abyss (below paddles)
        if (ball.y > height + 50) {
            resetBall();
        }

        // --- Paddle collisions ---
        const leftSeg = getFlipperSegment('left');
        const rightSeg = getFlipperSegment('right');

        function handlePaddleCollision(seg, side) {
            const {dist, closest} = pointToSegmentDist(
                ball.x, ball.y,
                seg.pivot.x, seg.pivot.y,
                seg.tip.x, seg.tip.y
            );
            if (dist < ball.radius) {
                // collision normal (pointing from segment to ball, normalized)
                let nx = ball.x - closest.x;
                let ny = ball.y - closest.y;
                const len = Math.hypot(nx, ny);
                if (len === 0) return;
                nx /= len; ny /= len;
                // reflect velocity
                const reflected = reflect(ball.vx, ball.vy, nx, ny);
                ball.vx = reflected.x;
                ball.vy = reflected.y;
                // add paddle velocity if moving upward (negative vy in paddle tip?)
                // compute paddle tip velocity due to rotation
                // angular velocity = paddle.angularSpeed
                // tip velocity = angularSpeed * length perpendicular to paddle
                // we only add impulse if paddle moving toward ball (i.e., dot product of paddle tip velocity and normal > 0)
                const paddle = flipper[side];
                const tipVelMagnitude = paddle.angularSpeed * flipper.width; // approximate
                // direction of tip movement: perpendicular to paddle, pointing "up" when angularSpeed>0
                // For left paddle: when angle increasing, tip moves up-left? We'll approximate by adding some upward impulse.
                const impulse = 0.3; // tweak
                if (paddle.angularSpeed > 0) {
                    ball.vy -= impulse; // upward kick
                    // also add some horizontal based on side
                    ball.vx += (side === 'left' ? -impulse : impulse);
                }
                // slight bounce boost
                ball.vx *= 1.1;
                ball.vy *= 1.1;
                // add score
                score += 5;
                scoreEl.textContent = `Puntuación: ${score}`;
            }
        }
        handlePaddleCollision(leftSeg, 'left');
        handlePaddleCollision(rightSeg, 'right');
    }

    function resetBall() {
        ball.x = width / 2;
        ball.y = height - 150;
        ball.vx = (Math.random() - 0.5) * 4;
        ball.vy = -6;
    }

    function draw() {
        // clear
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,width,height);
        // outer glow
        ctx.save();
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 20;
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(0,0,width,height);
        ctx.restore();

        // draw walls (simple lines)
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        // left wall
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(0,height);
        ctx.stroke();
        // right wall
        ctx.beginPath();
        ctx.moveTo(width,0);
        ctx.lineTo(width,height);
        ctx.stroke();
        // top arc approximated by a few lines
        ctx.beginPath();
        const arcRadius = 180;
        const arcCenterX = width/2;
        const arcCenterY = 60;
        const points = 16;
        for (let i=0;i<=points;i++) {
            const angle = Math.PI * (i/points); // 0 to pi
            const x = arcCenterX + arcRadius * Math.cos(angle);
            const y = arcCenterY + arcRadius * Math.sin(angle);
            if (i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.stroke();

        // draw paddles
        ctx.lineWidth = flipper.height;
        ctx.lineCap = 'round';
        // left paddle
        ctx.beginPath();
        ctx.strokeStyle = flipper.left.color;
        ctx.shadowColor = flipper.left.color;
        ctx.shadowBlur = 10;
        ctx.moveTo(flipper.left.pivotX, flipper.left.pivotY);
        const leftTip = rotatePoint(flipper.left.pivotX + flipper.width, flipper.left.pivotY, flipper.left.pivotX, flipper.left.pivotY, flipper.left.angle);
        ctx.lineTo(leftTip.x, leftTip.y);
        ctx.stroke();
        // right paddle
        ctx.beginPath();
        ctx.strokeStyle = flipper.right.color;
        ctx.shadowColor = flipper.right.color;
        ctx.shadowBlur = 10;
        ctx.moveTo(flipper.right.pivotX, flipper.right.pivotY);
        const rightTip = rotatePoint(flipper.right.pivotX - flipper.width, flipper.right.pivotY, flipper.right.pivotX, flipper.right.pivotY, flipper.right.angle);
        ctx.lineTo(rightTip.x, rightTip.y);
        ctx.stroke();

        // draw ball with gradient
        ctx.save();
        ctx.translate(ball.x, ball.y);
        const gradient = ctx.createRadialGradient(0,0,0,0,0,ball.radius);
        gradient.addColorStop(0, '#ffff00');
        gradient.addColorStop(0.7, '#ffcc00');
        gradient.addColorStop(1, '#ff9900');
        ctx.fillStyle = gradient;
        ctx.shadowColor = '#ff0';
        ctx.shadowBlur = ball.glow;
        ctx.beginPath();
        ctx.arc(0,0,ball.radius,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // === Main loop ===
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    resetBall();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
