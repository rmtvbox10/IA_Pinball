<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IA Pinball - Fixed Flippers</title>
<style>
    html,body{height:100%;margin:0;background:#111;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#fff;overflow:hidden;}
    canvas{background:#000;border:4px solid #0ff;box-shadow:0 0 20px #0ff;border-radius:8px;display:block;}
    #ui{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:1.2rem;letter-spacing:1px;text-shadow:0 0 5px #0ff;}
</style>
</head>
<body>
<canvas id="pinballCanvas" width="400" height="600"></canvas>
<div id="ui">Puntuación: 0</div>

<script>
(() => {
    const canvas = document.getElementById('pinballCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // === Ball ===
    const ball = {
        x: width / 2,
        y: 50, // start near top
        radius: 6,
        vx: 0,
        vy: 0,
        color: '#ff0',
        glow: 6
    };
    const gravity = 0.18;
    const friction = 0.99;
    const restitution = 0.85; // bounce off walls

    // === Flippers ===
    const flipperOffset = 80; // distance from center to pivot
    const flipperLength = 70; // length of flipper
    const flipperHeight = 10; // thickness
    const baseY = height - 30; // vertical position of pivots

    const leftFlipper = {
        pivotX: width/2 - flipperOffset,
        pivotY: baseY,
        length: flipperLength,
        angle: 20 * Math.PI/180, // rest: slightly down (positive angle)
        targetAngle: 20 * Math.PI/180,
        angularSpeed: 0,
        color: '#ff0'
    };
    const rightFlipper = {
        pivotX: width/2 + flipperOffset,
        pivotY: baseY,
        length: flipperLength,
        angle: Math.PI + 20 * Math.PI/180, // rest: 180+20 = 200 deg (down-left)
        targetAngle: Math.PI + 20 * Math.PI/180,
        angularSpeed: 0,
        color: '#ff0'
    };

    const maxAngle = 20 * Math.PI/180; // 20 degrees swing
    const maxAngSpeed = 0.3; // rad per frame

    // Input
    const keys = { ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', e => {
        if (e.key in keys) keys[e.key] = true;
    });
    window.addEventListener('keyup', e => {
        if (e.key in keys) keys[e.key] = false;
    });

    // Score
    let score = 0;
    const scoreEl = document.getElementById('ui');

    // === Helper functions ===
    function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
    }

    // Get flipper tip given angle
    function getTip(f) {
        // angle 0 points to the right (positive x)
        const tipX = f.pivotX + f.length * Math.cos(f.angle);
        const tipY = f.pivotY + f.length * Math.sin(f.angle); // note: canvas y increases down
        return {x: tipX, y: tipY};
    }

    // Distance from point (px,py) to segment (ax,ay)-(bx,by), returns {dist, closestPoint}
    function pointToSegmentDist(px, py, ax, ay, bx, by) {
        const dx = bx - ax;
        const dy = by - ay;
        const lenSq = dx*dx + dy*dy;
        if (lenSq === 0) {
            return {dist: Math.hypot(px-ax, py-ay), closest:{x:ax, y:ay}};
        }
        const t = ((px-ax)*dx + (py-ay)*dy) / lenSq;
        const clampT = Math.max(0, Math.min(1, t));
        const projX = ax + clampT * dx;
        const projY = ay + clampT * dy;
        return {
            dist: Math.hypot(px-projX, py-projY),
            closest: {x:projX, y:projY}
        };
    }

    // Reflect velocity (vx,vy) off surface with normal (nx,ny) (normalized)
    function reflect(vx, vy, nx, ny) {
        const dot = vx*nx + vy*ny;
        return {
            x: vx - 2 * dot * nx,
            y: vy - 2 * dot * ny
        };
    }

    // === Game update ===
    function update() {
        // --- Flipper input & motion ---
        const left = leftFlipper;
        const right = rightFlipper;
        // left
        if (keys.ArrowLeft) {
            left.targetAngle = -maxAngle; // swing up: -20 deg (up-right)
        } else {
            left.targetAngle = maxAngle; // rest: +20 deg (down-right)
        }
        // right
        if (keys.ArrowRight) {
            right.targetAngle = Math.PI - maxAngle; // 180-20 = 160 deg (up-left)
        } else {
            right.targetAngle = Math.PI + maxAngle; // rest: 180+20 = 200 deg (down-left)
        }
        // angular movement with spring-damper
        function updateFlipper(f) {
            const diff = f.targetAngle - f.angle;
            f.angularSpeed += diff * 0.12 - f.angularSpeed * 0.25;
            f.angularSpeed = clamp(f.angularSpeed, -maxAngSpeed, maxAngSpeed);
            f.angle += f.angularSpeed;
        }
        updateFlipper(left);
        updateFlipper(right);

        // --- Ball physics ---
        ball.vy += gravity;
        ball.vx *= friction;
        ball.vy *= friction;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // --- Wall collisions ---
        // left wall
        if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx = Math.abs(ball.vx) * restitution;
        }
        // right wall
        if (ball.x + ball.radius > width) {
            ball.x = width - ball.radius;
            ball.vx = -Math.abs(ball.vx) * restitution;
        }
        // top wall (flat)
        if (ball.y - ball.radius < 0) {
            ball.y = ball.radius;
            ball.vy = Math.abs(ball.vy) * restitution;
        }
        // bottom abyss (below flippers)
        if (ball.y > height + 50) {
            resetBall();
        }

        // --- Flipper collisions ---
        function handleFlipperCollision(f, side) {
            const tip = getTip(f);
            const {dist, closest} = pointToSegmentDist(
                ball.x, ball.y,
                f.pivotX, f.pivotY,
                tip.x, tip.y
            );
            if (dist < ball.radius) {
                // collision normal (from segment to ball)
                let nx = ball.x - closest.x;
                let ny = ball.y - closest.y;
                const len = Math.hypot(nx, ny);
                if (len === 0) return;
                nx /= len; ny /= len;
                // reflect velocity
                const reflected = reflect(ball.vx, ball.vy, nx, ny);
                ball.vx = reflected.x;
                ball.vy = reflected.y;
                // impulse if flipper moving toward ball (approximate: angularSpeed > 0 means tip moving in direction of increasing angle)
                // For left flipper: increasing angle (positive) moves tip down-right; we want upward impulse when moving toward ball (i.e., when angularSpeed < 0? Let's just add impulse when angularSpeed != 0 and dot product of tip velocity and normal > 0)
                // Simpler: add a kick upward along normal when flipper is moving (angularSpeed != 0)
                const impulse = 0.4;
                if (Math.abs(f.angularSpeed) > 0.01) {
                    ball.vx -= impulse * nx;
                    ball.vy -= impulse * ny;
                }
                // slight energy boost
                ball.vx *= 1.05;
                ball.vy *= 1.05;
                // score
                score += 10;
                scoreEl.textContent = `Puntuación: ${score}`;
            }
        }
        handleFlipperCollision(leftFlipper, 'left');
        handleFlipperCollision(rightFlipper, 'right');
    }

    function resetBall() {
        ball.x = width / 2;
        ball.y = 50;
        // random initial push
        ball.vx = (Math.random() - 0.5) * 4;
        ball.vy = 2; // initial downward? Actually we want it to fall due to gravity, so small positive vy or negative? We'll set slight downward.
        ball.vy = 2;
    }

    // === Draw ===
    function draw() {
        // clear
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,width,height);
        // outer neon glow
        ctx.save();
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 20;
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 4;
        ctx.strokeRect(0,0,width,height);
        ctx.restore();

        // draw walls (simple)
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        // left wall
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(0,height);
        ctx.stroke();
        // right wall
        ctx.beginPath();
        ctx.moveTo(width,0);
        ctx.lineTo(width,height);
        ctx.stroke();
        // top arc (semicircle at y=0)
        ctx.beginPath();
        const arcRadius = 160;
        const arcCenterX = width/2;
        const arcCenterY = -30; // slightly above so arc visible inside
        const points = 20;
        for (let i=0;i<=points;i++) {
            const angle = Math.PI * (i/points); // 0 to pi
            const x = arcCenterX + arcRadius * Math.cos(angle);
            const y = arcCenterY + arcRadius * Math.sin(angle);
            if (i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }
        ctx.stroke();

        // draw flippers
        ctx.lineWidth = flipperHeight;
        ctx.lineCap = 'round';
        // left flipper
        ctx.beginPath();
        ctx.strokeStyle = leftFlipper.color;
        ctx.shadowColor = leftFlipper.color;
        ctx.shadowBlur = 8;
        ctx.moveTo(leftFlipper.pivotX, leftFlipper.pivotY);
        const leftTip = getTip(leftFlipper);
        ctx.lineTo(leftTip.x, leftTip.y);
        ctx.stroke();
        // right flipper
        ctx.beginPath();
        ctx.strokeStyle = rightFlipper.color;
        ctx.shadowColor = rightFlipper.color;
        ctx.shadowBlur = 8;
        ctx.moveTo(rightFlipper.pivotX, rightFlipper.pivotY);
        const rightTip = getTip(rightFlipper);
        ctx.lineTo(rightTip.x, rightTip.y);
        ctx.stroke();

        // draw ball with gradient
        ctx.save();
        ctx.translate(ball.x, ball.y);
        const gradient = ctx.createRadialGradient(0,0,0,0,0,ball.radius);
        gradient.addColorStop(0, '#ffff00');
        gradient.addColorStop(0.6, '#ffcc00');
        gradient.addColorStop(1, '#ff9900');
        ctx.fillStyle = gradient;
        ctx.shadowColor = '#ff0';
        ctx.shadowBlur = ball.glow;
        ctx.beginPath();
        ctx.arc(0,0,ball.radius,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // === Main loop ===
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    resetBall();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
